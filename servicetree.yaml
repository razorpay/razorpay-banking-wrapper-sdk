service: razorpay-banking-wrapper-sdk  # required, canonical slug — immutable once registered
displayName: "Razorpay Banking Wrapper SDK (iOS)"  # README title 'Razorpay Banking Wrapper SDK for iOS'
description: "iOS banking wrapper SDK (Swift, SwiftPM and CocoaPods) that merchants add to their app to pull in the Razorpay SDK automatically — a thin wrapper exposing only the RazorpayBankingWrapper module."  # repo README (requirements iOS 15+/Xcode 14+, SwiftPM and CocoaPods install instructions)
type: library  # an iOS SDK distributed via Swift Package Manager and CocoaPods — merchant-app dependency, no server deployment · retype after the serviceTypes enum widens: sdk
tier: T1  # ships inside merchant iOS apps on the banking/payment path; a broken release degrades in-app payments for every merchant integrating it, though rollouts are merchant-controlled
lifecycle: live  # published as versioned SwiftPM/CocoaPods packages; last push 2026-07-15

domain: pg-growth/checkout  # family payments-platform from miss_seed l1 (BU 'Payments', team/POD 'PG Growth'); the PG Growth group's existing areas are checkout and magic-checkout — a merchant-integration SDK fits pg-growth/checkout. Noting the same family mismatch as other PG Growth entries: the existing area lives under pg-growth · note: family chosen for area reuse

